<div class="col-md-4"><label class="form-label">{{ t('settings.concurrency') }}</label>
  <input class="form-control" name="concurrency" value="{{ settings.concurrency }}">
  <div class="form-text">{{ t('settings.concurrency_hint') }}</div></div>
<div class="col-md-4"><label class="form-label">{{ t('settings.ssh_connect_timeout') }}</label>
  <div class="input-group"><input class="form-control" name="ssh_connect_timeout" value="{{ settings.ssh_connect_timeout }}"><span class="input-group-text">{{ t('common.seconds') }}</span></div></div>
<div class="col-md-4"><label class="form-label">{{ t('settings.ssh_command_timeout') }}</label>
  <div class="input-group"><input class="form-control" name="ssh_command_timeout" value="{{ settings.ssh_command_timeout }}"><span class="input-group-text">{{ t('common.seconds') }}</span></div></div>
