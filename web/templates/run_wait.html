{% extends "base.html" %}
{% block title %}巡检执行中{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">巡检执行中</div>
      <div class="card-body">
        <p class="mb-2" id="phase">已提交，等待后台启动…</p>
        <div class="progress" style="height: 24px;">
          <div id="bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 100%"></div>
        </div>
        <div class="d-flex justify-content-between mt-2 text-muted small">
          <span id="info">状态：运行中</span>
          <span>已用时 <span id="elapsed">0s</span></span>
        </div>
        <div class="mt-3 text-muted small">完成后将自动跳转到本次执行报告；也可手动前往
          <a href="{{ url_for('reports') }}">报告列表</a> 或
          <a href="{{ url_for('run_page') }}">返回立即执行</a>。
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const after = {{ after }};
  const progressUrl = {{ url_for('run_progress') | tojson }};
  const bar = document.getElementById('bar');
  const label = document.getElementById('phase');
  const info = document.getElementById('info');
  const elapsedEl = document.getElementById('elapsed');
  const startTs = Date.now();

  setInterval(() => { elapsedEl.textContent = Math.round((Date.now() - startTs) / 1000) + 's'; }, 1000);

  function setProgress(p) {
    if (!p || !p.total) {
      bar.classList.add('progress-bar-striped', 'progress-bar-animated');
      bar.style.width = '100%';
      bar.textContent = '';
      return;
    }
    bar.classList.remove('progress-bar-striped', 'progress-bar-animated');
    const pct = Math.max(0, Math.min(100, Math.round(p.done / p.total * 100)));
    bar.style.width = pct + '%';
    bar.textContent = pct + '%';
    if (p.label) label.textContent = p.label + '（' + p.done + '/' + p.total + '）';
  }

  async function poll() {
    try {
      const res = await fetch(progressUrl + '?after=' + after);
      const d = await res.json();
      if (d.found) {
        setProgress(d.progress);
        if (d.running) {
          info.textContent = '状态：运行中';
        } else {
          label.textContent = (d.status === 'success' ? '巡检完成' : ('巡检结束（' + d.status + '）'));
          bar.classList.remove('progress-bar-striped', 'progress-bar-animated');
          bar.style.width = '100%';
          bar.textContent = '100%';
          info.textContent = '正在打开报告…';
          setTimeout(() => { window.location = d.report_url; }, 700);
          return;
        }
      } else {
        label.textContent = d.running ? '初始化中…' : '等待后台启动…';
      }
    } catch (e) { /* 网络抖动，继续轮询 */ }
    setTimeout(poll, 1000);
  }
  poll();
})();
</script>
{% endblock %}
