<div class="col-12">
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" name="warn_push_enabled" id="warn_push_enabled" {{ 'checked' if settings.warn_push_enabled == 'true' else '' }}>
    <label class="form-check-label" for="warn_push_enabled">{{ t('settings.warn_push') }}</label></div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" name="notify_oversize_enabled" id="notify_oversize_enabled" {{ 'checked' if settings.notify_oversize_enabled == 'true' else '' }}>
    <label class="form-check-label" for="notify_oversize_enabled">{{ t('settings.notify_oversize') }}</label></div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" name="notify_ambiguous_enabled" id="notify_ambiguous_enabled" {{ 'checked' if settings.notify_ambiguous_enabled == 'true' else '' }}>
    <label class="form-check-label" for="notify_ambiguous_enabled">{{ t('settings.notify_ambiguous') }}</label></div>
  <div class="form-text">{{ t('settings.notify_hint') }}</div>
</div>
